<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event QR Checker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Scanner Library (html5-qrcode) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">Event Guest Checker</h1>

        <!-- QR Scanner Viewport -->
        <div id="reader" class="w-full rounded-xl overflow-hidden border-2 border-blue-500 mb-4"></div>

        <!-- Result Card -->
        <div id="resultCard" class="hidden border rounded-2xl p-4 bg-gray-50 text-center mt-4 shadow-inner">
            <img id="guestImg" src="" alt="Guest Photo" class="w-24 h-24 rounded-full mx-auto mb-3 object-cover border-4 border-blue-500">
            <h2 id="guestName" class="text-xl font-bold text-gray-800"></h2>
            <p id="guestStatus" class="inline-block px-3 py-1 text-xs font-semibold rounded-full my-2"></p>
            
            <div class="text-left text-sm text-gray-600 mt-3 space-y-1 bg-white p-3 rounded-lg border">
                <p><strong>Code:</strong> <span id="guestCode"></span></p>
                <p><strong>Invite Date:</strong> <span id="guestDate"></span></p>
                <p><strong>Phone:</strong> <span id="guestPhone"></span></p>
            </div>

            <button onclick="resetScanner()" class="mt-4 w-full bg-blue-600 text-white py-2.5 rounded-xl font-semibold hover:bg-blue-700">තවත් QR එකක් Scan කරන්න</button>
        </div>

        <!-- Error Alert -->
        <div id="errorMsg" class="hidden p-4 bg-red-100 border border-red-300 text-red-700 rounded-xl text-center mt-4">
            <p class="font-bold">වලංගු නොවන QR Code එකකි!</p>
            <button onclick="resetScanner()" class="mt-3 w-full bg-red-600 text-white py-1.5 rounded-lg text-sm font-semibold hover:bg-red-700">නැවත Scan කරන්න</button>
        </div>
    </div>

    <script>
        // 1. අමුත්තන්ගේ දත්ත පද්ධතිය (Guest Database)
        const guests = [
            {
                code: "fr345tsgus",
                name: "Kasun Kalhara",
                inviteDate: "2026-11-10",
                status: "VIP",
                phone: "0771234567",
                photo: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80"
            },
            {
                code: "inv987654",
                name: "Nimali Perera",
                inviteDate: "2026-11-10",
                status: "Regular",
                phone: "0719876543",
                photo: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80"
            }
        ];

        let html5QrCode;

        // 2. QR Code එක Scan වූ විට ක්‍රියාත්මක වන කොටස
        function onScanSuccess(decodedText, decodedResult) {
            // කැමරාව තාවකාලිකව නවතා දමයි
            html5QrCode.stop().then((ignore) => {
                verifyCode(decodedText);
            }).catch((err) => {
                verifyCode(decodedText);
            });
        }

        // 3. Code එක පද්ධතියේ තිබේදැයි පරීක්ෂා කිරීම
        function verifyCode(scannedCode) {
            const guest = guests.find(g => g.code.trim().toLowerCase() === scannedCode.trim().toLowerCase());

            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');
            const readerElem = document.getElementById('reader');

            readerElem.classList.add('hidden');

            if (guest) {
                document.getElementById('guestImg').src = guest.photo;
                document.getElementById('guestName').innerText = guest.name;
                document.getElementById('guestCode').innerText = guest.code;
                document.getElementById('guestDate').innerText = guest.inviteDate;
                document.getElementById('guestPhone').innerText = guest.phone;

                const statusElem = document.getElementById('guestStatus');
                statusElem.innerText = guest.status;
                if (guest.status === "VIP") {
                    statusElem.className = "inline-block px-3 py-1 text-xs font-semibold rounded-full my-2 bg-yellow-100 text-yellow-800 border border-yellow-300";
                } else {
                    statusElem.className = "inline-block px-3 py-1 text-xs font-semibold rounded-full my-2 bg-green-100 text-green-800 border border-green-300";
                }

                resultCard.classList.remove('hidden');
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        // 4. නැවත Scan කිරීම සඳහා Reset කිරීම
        function resetScanner() {
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('reader').classList.remove('hidden');
            startScanner();
        }

        // 5. කැමරාව ආරම්භ කිරීම
        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch((err) => {
                // පසුපස කැමරාව ලබාගත නොහැකි නම් සාමාන්‍ය කැමරාව උත්සාහ කරයි
                html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
                .catch((err2) => {
                    alert("කැමරාව ක්‍රියාත්මක කිරීම අසාර්ථක විය. කරුණාකර Browser එකේ Camera Permission ලබා දී ඇත්දැයි පරීක්ෂා කරන්න.");
                });
            });
        }

        // Page එක Load වූ වහාම කැමරාව පටන් ගනී
        window.onload = function() {
            startScanner();
        };
    </script>
</body>
</html>
