<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Guest Verification System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(59, 130, 246, 0.5); }
            50% { border-color: rgba(59, 130, 246, 1); }
        }
        .scanner-glow {
            animation: pulse-border 2s infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen p-4 flex flex-col items-center justify-center text-slate-100">

    <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-xl border border-slate-700 rounded-3xl shadow-2xl p-6 transition-all duration-300">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <span class="bg-blue-500/10 text-blue-400 text-xs font-semibold px-3 py-1 rounded-full border border-blue-500/20">Secure Event Pass</span>
            <h1 class="text-2xl font-extrabold text-white mt-2 tracking-wide">Guest Verification</h1>
            <p class="text-xs text-slate-400 mt-1">අමුත්තන්ගේ QR කේතය ස්කෑන් කරන්න</p>
        </div>

        <!-- QR Scanner Viewport -->
        <div id="scannerContainer" class="relative overflow-hidden rounded-2xl border-4 scanner-glow bg-slate-900 shadow-inner mb-4 transition-all">
            <div id="reader" class="w-full"></div>
        </div>

        <!-- Result Card (Hidden by default with smooth transition) -->
        <div id="resultCard" class="hidden transform transition-all duration-500 scale-95 opacity-0 bg-slate-900/90 border border-slate-700 rounded-2xl p-5 text-center shadow-2xl">
            <div class="relative w-28 h-28 mx-auto mb-4">
                <img id="guestImg" src="" alt="Guest Photo" class="w-28 h-28 rounded-full object-cover border-4 border-blue-500 shadow-lg">
                <span id="statusBadge" class="absolute bottom-0 right-0 px-2.5 py-0.5 text-xs font-bold rounded-full text-white shadow"></span>
            </div>
            
            <h2 id="guestName" class="text-2xl font-bold text-white tracking-tight"></h2>
            
            <div class="text-left text-xs text-slate-300 mt-4 space-y-2 bg-slate-800/90 p-4 rounded-xl border border-slate-700/60 shadow-sm">
                <div class="flex justify-between border-b border-slate-700 pb-1.5">
                    <span class="text-slate-400">Guest Code:</span>
                    <span id="guestCode" class="font-mono font-semibold text-blue-400"></span>
                </div>
                <div class="flex justify-between border-b border-slate-700 pb-1.5">
                    <span class="text-slate-400">Invite Date:</span>
                    <span id="guestDate" class="font-medium text-slate-200"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">Phone:</span>
                    <span id="guestPhone" class="font-mono text-slate-200"></span>
                </div>
            </div>

            <button onclick="resetScanner()" class="mt-5 w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-600/30 transition duration-200 transform active:scale-95">
                🔄 තවත් QR එකක් Scan කරන්න
            </button>
        </div>

        <!-- Error Alert Card -->
        <div id="errorMsg" class="hidden transform transition-all duration-300 bg-red-950/80 border border-red-800/60 text-red-200 rounded-2xl p-5 text-center shadow-xl">
            <div class="w-12 h-12 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold">✕</div>
            <p class="font-bold text-lg">වලංගු නොවන Code එකකි!</p>
            <p class="text-xs text-red-300 mt-1">මෙම QR code එක පද්ධතියේ ලියාපදිංචි කර නැත.</p>
            <button onclick="resetScanner()" class="mt-4 w-full bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-red-600/30 transition duration-200">
                නැවත Scan කරන්න
            </button>
        </div>

        <!-- Footer Note -->
        <div class="text-center mt-4">
            <p class="text-[10px] text-slate-500">Offline Event System v2.0</p>
        </div>
    </div>

    <script>
        // අමුත්තන්ගේ දත්ත පද්ධතිය (Guest Database)
        const guests = [
            {
                code: "fr345tsgus",
                name: "Kasun Kalhara",
                inviteDate: "2026-11-10",
                status: "VIP",
                phone: "0771234567",
                photo: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80"
            },
            {
                code: "inv987654",
                name: "Nimali Perera",
                inviteDate: "2026-11-10",
                status: "Regular",
                phone: "0719876543",
                photo: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80"
            }
        ];

        let html5QrCode;

        function onScanSuccess(decodedText, decodedResult) {
            html5QrCode.stop().then(() => {
                verifyCode(decodedText);
            }).catch((err) => {
                verifyCode(decodedText);
            });
        }

        function verifyCode(scannedCode) {
            const guest = guests.find(g => g.code.trim().toLowerCase() === scannedCode.trim().toLowerCase());

            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');
            const scannerContainer = document.getElementById('scannerContainer');

            scannerContainer.classList.add('hidden');

            if (guest) {
                document.getElementById('guestImg').src = guest.photo;
                document.getElementById('guestName').innerText = guest.name;
                document.getElementById('guestCode').innerText = guest.code;
                document.getElementById('guestDate').innerText = guest.inviteDate;
                document.getElementById('guestPhone').innerText = guest.phone;

                const badge = document.getElementById('statusBadge');
                badge.innerText = guest.status;
                if (guest.status === "VIP") {
                    badge.className = "absolute bottom-0 right-0 px-3 py-1 text-xs font-bold rounded-full bg-amber-500 text-slate-950 shadow-md border-2 border-slate-900";
                } else {
                    badge.className = "absolute bottom-0 right-0 px-3 py-1 text-xs font-bold rounded-full bg-emerald-500 text-slate-950 shadow-md border-2 border-slate-900";
                }

                resultCard.classList.remove('hidden');
                setTimeout(() => {
                    resultCard.classList.remove('scale-95', 'opacity-0');
                    resultCard.classList.add('scale-100', 'opacity-100');
                }, 50);
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function resetScanner() {
            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');
            const scannerContainer = document.getElementById('scannerContainer');

            resultCard.classList.add('scale-95', 'opacity-0');
            resultCard.classList.add('hidden');
            errorMsg.classList.add('hidden');
            scannerContainer.classList.remove('hidden');

            startScanner();
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 220, height: 220 } };
            
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch((err) => {
                html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
                .catch((err2) => {
                    alert("කැමරාව ක්‍රියාත්මක කිරීම අසාර්ථක විය. කරුණාකර Camera Permission ලබා දී ඇත්දැයි පරීක්ෂා කරන්න.");
                });
            });
        }

        window.onload = function() {
            startScanner();
        };
    </script>
</body>
</html>
